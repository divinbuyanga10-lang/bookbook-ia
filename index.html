<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>boockBook IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:white;display:flex;flex-direction:column;height:90vh}
header{padding:15px;text-align:center;border-bottom:1px solid #334155}
header h1 span{color:#38bdf8}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5}
.user{align-self:flex-end;background:#2563eb}
.bot{align-self:flex-start;background:#1e293b;border:1px solid #334155}
.box{display:flex;padding:12px;gap:8px;background:#1e293b}
.box input{flex:1;padding:14px;border-radius:30px;border:none;background:#0f172a;color:white;outline:none}
.box button{padding:14px 20px;border-radius:30px;border:none;background:#38bdf8;font-weight:bold}
.bot h1,
.bot h2,
.bot h3 {
    margin: 12px 0 8px;
    line-height: 1.3;
}

.bot p {
    margin: 8px 0;
}

.bot ul,
.bot ol {
    margin: 8px 0;
    padding-left: 25px;
}

.bot li {
    margin: 5px 0;
}

.bot code {
    background: #0f172a;
    padding: 3px 6px;
    border-radius: 5px;
    font-family: monospace;
    font-size: 13px;
}

.bot pre {
    background: #020617;
    padding: 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 12px 0;
    border: 1px solid #334155;
}

.bot pre code {
    background: none;
    padding: 0;
    line-height: 1.5;
}
.bot .code-container {
    position: relative;
    margin: 12px 0;
}

.bot .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #334155;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
}

.bot .copy-btn:active {
    transform: scale(0.95);
}
.typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 0;
}

.typing span {
    width: 7px;
    height: 7px;
    background: #38bdf8;
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
}

.typing span:nth-child(2) {
    animation-delay: 0.2s;
}

.typing span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes typing {
    0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-4px);
    }
}
.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

#historyBtn {
    background: #1e293b;
    color: white;
    border: 1px solid #334155;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
}

#historyBtn:active {
    transform: scale(0.95);
}

#historyPanel {
    display: none;
    position: absolute;
    top: 65px;
    right: 10px;
    width: 280px;
    max-height: 400px;
    overflow-y: auto;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 15px;
    padding: 15px;
    z-index: 9999;
    text-align: left;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

#historyPanel h2 {
    font-size: 18px;
    margin-bottom: 10px;
}

#historyPanel p {
    color: #94a3b8;
    font-size: 14px;
}
header {
    position: relative;
}

#historyPanel {
    display: none;
    position: absolute;
    top: 75px;
    right: 15px;
    width: 280px;
    max-height: 400px;
    overflow-y: auto;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 15px;
    padding: 15px;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}
.history-item {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px;
    margin-top: 8px;
    cursor: pointer;
}

.history-item:active {
    transform: scale(0.98);
}

.history-question {
    font-size: 14px;
    color: white;
    line-height: 1.4;
}

.history-item small {
    display: block;
    margin-top: 5px;
    color: #94a3b8;
    font-size: 11px;
}
#newChatBtn {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #020617;
    font-weight: bold;
    cursor: pointer;
}

#newChatBtn:active {
    transform: scale(0.97);
}
</style>+
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">

<script defer
src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer
src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"
onload="window.katexAutoRenderLoaded = true">
</script>
</head>
<body>
<header>
    <div class="header-top">
        <h1>boockBook <span>IA</span></h1>

        <button id="historyBtn">📚</button>
    </div>

    <div id="historyPanel">
        <h2>📚 Historique</h2>

        <button id="newChatBtn">
            ➕ Nouvelle conversation
        </button>

        <div id="historyList">
            <p>Aucun historique de conversation pour le moment.</p>
        </div>
    </div>
</header>
<div id="chat"><div class="msg bot">API connectée ✅ Pose ta question RLC !</div></div>
<div class="box">
<input id="q" placeholder="Ex: Calcule Z pour R=100, L=10mH, C=50uF">
<button onclick="ask()">Envoyer</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
function renderMath(element) {
    if (typeof renderMathInElement !== "undefined") {
        renderMathInElement(element, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "$", right: "$", display: false},
                {left: "\\(", right: "\\)", display: false},
                {left: "\\[", right: "\\]", display: true}
            ],
            throwOnError: false
        });
    }
}
function saveConversation(question, answer) {
    let history = JSON.parse(
        localStorage.getItem("bookbook_history")
    ) || [];

    history.push({
        question: question,
        answer: answer,
        date: new Date().toLocaleString("fr-FR")
    });

    localStorage.setItem(
        "bookbook_history",
        JSON.stringify(history)
    );
}

function loadHistory() {

    const historyList = document.getElementById("historyList");

    let history = JSON.parse(
        localStorage.getItem("bookbook_history")
    ) || [];

    if (history.length === 0) {
        historyList.innerHTML =
            "<p>Aucun historique de conversation pour le moment.</p>";
        return;
    }

    historyList.innerHTML = "";

    history.forEach((conversation, index) => {

        const item = document.createElement("div");

        item.className = "history-item";

        item.innerHTML = `
            <div class="history-question">
                💬 ${conversation.question}
            </div>

            <small>${conversation.date}</small>
        `;

        historyList.appendChild(item);
    });
}
async function ask() {
    const question = input.value.trim();

    if (!question) return;

    chat.innerHTML += `
        <div class="msg user">${question}</div>
    `;

    input.value = "";

    // On crée l'identifiant AVANT de l'utiliser
    const id = Date.now();

    // Message de chargement
    chat.innerHTML += `
        <div class="msg bot" id="${id}">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch('/chat',{
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await res.json();

        const botMessage = document.getElementById(id);

        const answer = data.reponse || data.error;

botMessage.innerHTML = marked.parse(answer);

saveConversation(question, answer);

        renderMath(botMessage);

        // Boutons Copier
        botMessage.querySelectorAll("pre").forEach(pre => {

            const container = document.createElement("div");
            container.className = "code-container";

            const button = document.createElement("button");
            button.className = "copy-btn";
            button.textContent = "📋 Copier";

            button.onclick = async () => {

                const code = pre.querySelector("code");

                await navigator.clipboard.writeText(
                    code.textContent
                );

                button.textContent = "✅ Copié";

                setTimeout(() => {
                    button.textContent = "📋 Copier";
                }, 1500);
            };

            pre.parentNode.insertBefore(container, pre);

            container.appendChild(pre);
            container.appendChild(button);
        });

    } catch (e) {

        document.getElementById(id).textContent =
            "Erreur : Vérifie que ton API tourne dans Termux.";

        console.error(e);
    }

    chat.scrollTop = chat.scrollHeight;
}
const historyBtn = document.getElementById("historyBtn");
const historyPanel = document.getElementById("historyPanel");

historyBtn.addEventListener("click", function () {

    if (historyPanel.style.display === "block") {

        historyPanel.style.display = "none";

    } else {

        historyPanel.style.display = "block";

        loadHistory();
    }

});
const newChatBtn = document.getElementById("newChatBtn");

newChatBtn.addEventListener("click", function () {

    chat.innerHTML = `
        <div class="msg bot">
            Nouvelle conversation ✅<br>
            Pose-moi ta question !
        </div>
    `;

    historyPanel.style.display = "none";

    input.focus();
});
input.addEventListener("keypress", e=>{if(e.key==="Enter") ask()});
</script>
</body>
</html>
