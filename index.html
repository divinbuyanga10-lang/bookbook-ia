<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>boockBook IA</title>

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- KaTeX -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    >

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js">
    </script>

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js">
    </script>


    <style>

        /* =========================
           RESET
        ========================= */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body{
            background:#0f172a;
            color:white;

            display:flex;

            height:100vh;
            height:100dvh;

            overflow:hidden;
        }


        /* =========================
           HISTORIQUE
        ========================= */

        #historyPanel{

            width:260px;
            min-width:260px;

            background:#1e293b;

            border-right:1px solid #334155;

            padding:12px;

            overflow-y:auto;

            display:flex;
            flex-direction:column;

            transition:0.3s;
        }


        #historyPanel h2{

            font-size:16px;

            margin-bottom:10px;
        }


        #newChatBtn{

            width:100%;

            padding:10px;

            border-radius:8px;

            border:none;

            background:#38bdf8;

            color:#0f172a;

            font-weight:bold;

            margin-bottom:12px;

            cursor:pointer;
        }


        #newChatBtn:hover{

            opacity:0.9;
        }


        #historyList div{

            padding:10px;

            border-radius:6px;

            cursor:pointer;

            font-size:13px;

            word-break:break-word;

            margin-bottom:4px;
        }


        #historyList div:hover{

            background:#334155;
        }


        #historyList p{

            color:#94a3b8;

            font-size:13px;

            padding:10px;
        }


        /* =========================
           MAIN
        ========================= */

        .main{

            flex:1;

            display:flex;

            flex-direction:column;

            min-width:0;
        }


        /* =========================
           HEADER
        ========================= */

        header{

            padding:12px 15px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            gap:10px;

            border-bottom:1px solid #334155;

            background:#1e293b;
        }


        header h1{

            font-size:18px;

            white-space:nowrap;

            overflow:hidden;

            text-overflow:ellipsis;
        }


        header h1 span{

            color:#38bdf8;
        }


        /* =========================
           MENU MOBILE
        ========================= */

        #menuBtn{

            display:none;

            font-size:22px;

            background:none;

            border:none;

            color:white;

            cursor:pointer;
        }


        /* =========================
           MODE IA
        ========================= */

        #modeSelect{

            padding:8px 10px;

            border-radius:8px;

            border:1px solid #334155;

            background:#0f172a;

            color:white;

            font-size:13px;

            cursor:pointer;
        }


        #modeSelect:focus{

            outline:none;

            border-color:#38bdf8;
        }


        /* =========================
           CHAT
        ========================= */

        #chat{

            flex:1;

            overflow-y:auto;

            padding:20px;

            display:flex;

            flex-direction:column;

            gap:12px;

            scroll-behavior:smooth;
        }


        /* =========================
           MESSAGES
        ========================= */

        .msg{

            max-width:85%;

            padding:12px 16px;

            border-radius:18px;

            font-size:14px;

            line-height:1.6;

            word-wrap:break-word;

            overflow-wrap:break-word;
        }


        .user{

            align-self:flex-end;

            background:#2563eb;

            border-bottom-right-radius:5px;
        }


        .bot{

            align-self:flex-start;

            background:#1e293b;

            border:1px solid #334155;

            border-bottom-left-radius:5px;
        }


        /* =========================
           MARKDOWN
        ========================= */

        .bot h1,
        .bot h2,
        .bot h3{

            margin:12px 0 8px;
        }


        .bot p{

            margin:7px 0;
        }


        .bot ul,
        .bot ol{

            margin:8px 0 8px 22px;
        }


        .bot li{

            margin:4px 0;
        }


        .bot blockquote{

            border-left:4px solid #38bdf8;

            padding-left:12px;

            margin:10px 0;

            color:#cbd5e1;
        }


        .bot table{

            width:100%;

            border-collapse:collapse;

            margin:12px 0;

            overflow:hidden;
        }


        .bot th,
        .bot td{

            border:1px solid #475569;

            padding:8px;

            text-align:left;
        }


        .bot th{

            background:#334155;
        }


        .bot a{

            color:#38bdf8;
        }


        /* =========================
           CODE
        ========================= */

        .code-container{

            position:relative;

            margin:10px 0;
        }


        .code-container pre{

            background:#020617;

            border:1px solid #334155;

            border-radius:8px;

            padding:14px;

            overflow-x:auto;

            white-space:pre;
        }


        .code-container code{

            font-family:monospace;

            font-size:13px;
        }


        .copy-btn{

            position:absolute;

            top:7px;

            right:7px;

            border:none;

            background:#334155;

            color:white;

            padding:5px 8px;

            border-radius:5px;

            cursor:pointer;

            font-size:11px;
        }


        .copy-btn:hover{

            background:#475569;
        }


        /* =========================
           INPUT
        ========================= */

        .box{

            display:flex;

            padding:10px;

            gap:8px;

            background:#1e293b;

            align-items:center;

            border-top:1px solid #334155;
        }


        .box input{

            flex:1;

            min-width:0;

            padding:14px;

            border-radius:30px;

            border:none;

            background:#0f172a;

            color:white;

            outline:none;

            font-size:16px;
        }


        .box input::placeholder{

            color:#64748b;
        }


        .box button{

            padding:14px 20px;

            border-radius:30px;

            border:none;

            background:#38bdf8;

            color:#0f172a;

            font-weight:bold;

            cursor:pointer;

            white-space:nowrap;
        }


        .box button:hover{

            opacity:0.9;
        }


        .box button:disabled{

            opacity:0.5;

            cursor:not-allowed;
        }


        /* =========================
           OVERLAY
        ========================= */

        #overlay{

            display:none;

            position:fixed;

            inset:0;

            background:rgba(0,0,0,0.5);

            z-index:9;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:768px){

            #historyPanel{

                position:fixed;

                left:-100%;

                top:0;

                bottom:0;

                z-index:10;

                width:80%;

                max-width:300px;
            }


            #historyPanel.open{

                left:0;
            }


            #overlay.show{

                display:block;
            }


            #menuBtn{

                display:block;
            }


            header h1{

                font-size:16px;

                flex:1;

                text-align:center;
            }


            #modeSelect{

                font-size:12px;

                padding:7px;

                max-width:150px;
            }


            #chat{

                padding:12px;
            }


            .msg{

                max-width:95%;

                font-size:13px;
            }


            .box{

                padding:8px;
            }


            .box input{

                padding:12px;

                font-size:16px;
            }


            .box button{

                padding:12px 16px;
            }

        }


        /* =========================
           TABLETTE
        ========================= */

        @media(min-width:769px) and (max-width:1024px){

            #historyPanel{

                width:220px;

                min-width:220px;
            }


            .msg{

                max-width:90%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         OVERLAY MOBILE
    ========================= -->

    <div
        id="overlay"
        onclick="toggleMenu()">
    </div>


    <!-- =========================
         HISTORIQUE
    ========================= -->

    <div id="historyPanel">

        <h2>⏳ Historique</h2>

        <button id="newChatBtn">
            ➕ Nouvelle conversation
        </button>

        <div id="historyList">

            <p>Aucun historique</p>

        </div>

    </div>


    <!-- =========================
         APPLICATION PRINCIPALE
    ========================= -->

    <div class="main">


        <!-- =========================
             HEADER
        ========================= -->

        <header>

            <button
                id="menuBtn"
                onclick="toggleMenu()">
                ☰
            </button>


            <h1>
                boockBook <span>IA</span>
            </h1>


            <!-- MODE IA -->

            <select id="modeSelect">

                <option value="normal">
                    💬 Chat normal
                </option>

                <option value="professeur">
                    🎓 Professeur
                </option>

            </select>

        </header>


        <!-- =========================
             CHAT
        ========================= -->

        <div id="chat">

            <div class="msg bot">

                API connectée ✅

                <br><br>

                Pose ta question à boockBook IA.

            </div>

        </div>


        <!-- =========================
             ZONE DE SAISIE
        ========================= -->

        <div class="box">

            <input
                id="q"
                type="text"
                placeholder="Pose ta question..."
                autocomplete="off"
            >


            <button
                id="sendBtn"
                onclick="ask()">

                Envoyer

            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* =========================
           MENU
        ========================= */

        function toggleMenu(){

            document
                .getElementById("historyPanel")
                .classList.toggle("open");

            document
                .getElementById("overlay")
                .classList.toggle("show");

        }


        /* =========================
           ELEMENTS
        ========================= */

        const chat =
            document.getElementById("chat");

        const input =
            document.getElementById("q");

        const historyList =
            document.getElementById("historyList");

        const sendBtn =
            document.getElementById("sendBtn");

        const modeSelect =
            document.getElementById("modeSelect");


        /* =========================
           HISTORIQUE
        ========================= */

        let conversations =
            JSON.parse(
                localStorage.getItem(
                    "boock_history"
                ) || "[]"
            );


        /* =========================
           FORMATTER LA REPONSE IA
        ========================= */
function formatBotMessage(element, text){

    /*
     * Préparation des formules mathématiques
     *
     * On convertit les anciens délimiteurs LaTeX
     * vers le format utilisé par KaTeX.
     */

    let mathText = text || "";


    /*
     * \[ ... \]  →  $$ ... $$
     */

    mathText = mathText.replace(
        /\\\[([\s\S]*?)\\\]/g,
        "$$$$$1$$$$"
    );


    /*
     * \( ... \)  →  $ ... $
     */

    mathText = mathText.replace(
        /\\\(([\s\S]*?)\\\)/g,
        "$$$1$$"
    );


    /*
     * Markdown
     */

    element.innerHTML =
        marked.parse(mathText);


    /*
     * Blocs de code
     */

    element
        .querySelectorAll("pre")
        .forEach(pre => {

            const container =
                document.createElement("div");

            container.className =
                "code-container";


            const button =
                document.createElement("button");

            button.className =
                "copy-btn";

            button.textContent =
                "Copier";


            button.onclick =
                async () => {

                    const code =
                        pre.innerText;

                    try{

                        await navigator
                            .clipboard
                            .writeText(code);

                        button.textContent =
                            "Copié ✓";


                        setTimeout(() => {

                            button.textContent =
                                "Copier";

                        },1500);

                    }
                    catch(error){

                        console.error(error);

                        button.textContent =
                            "Erreur";

                    }

                };


            pre.parentNode.insertBefore(
                container,
                pre
            );


            container.appendChild(pre);

            container.appendChild(button);

        });


    /*
     * Mathématiques KaTeX
     */

    if(
        typeof renderMathInElement ===
        "function"
    ){

        renderMathInElement(
            element,
            {

                delimiters:[

                    {
                        left:"$$",
                        right:"$$",
                        display:true
                    },

                    {
                        left:"$",
                        right:"$",
                        display:false
                    }

                ],

                throwOnError:false,

                strict:false

            }
        );

    }

}
        /* =========================
           SAUVEGARDER LA CONVERSATION
        ========================= */

        function saveCurrent(){

            if(chat.innerText.length < 10){

                return;

            }


            localStorage.setItem(
                "current_chat",
                chat.innerHTML
            );


            let title =
                chat.innerText
                    .replace(/\n+/g," ")
                    .trim()
                    .slice(0,40);


            conversations =
                conversations.filter(
                    c => c.title !== title
                );


            conversations.push({

                title:title,

                html:chat.innerHTML,

                date:Date.now()

            });


            /*
             * Maximum 20 conversations
             */

            if(conversations.length > 20){

                conversations.shift();

            }


            localStorage.setItem(
                "boock_history",
                JSON.stringify(
                    conversations
                )
            );


            renderHist();

        }


        /* =========================
           AFFICHER HISTORIQUE
        ========================= */

        function renderHist(){

            if(!conversations.length){

                historyList.innerHTML =
                    "<p>Aucun historique</p>";

                return;

            }


            historyList.innerHTML = "";


            conversations
                .slice()
                .reverse()
                .forEach(c => {

                    const d =
                        document.createElement(
                            "div"
                        );


                    d.textContent =
                        c.title;


                    d.onclick = () => {

                        chat.innerHTML =
                            c.html;


                        localStorage.setItem(
                            "current_chat",
                            c.html
                        );


                        if(
                            window.innerWidth <= 768
                        ){

                            toggleMenu();

                        }

                    };


                    historyList
                        .appendChild(d);

                });

        }


        /* =========================
           NOUVELLE CONVERSATION
        ========================= */

        document
            .getElementById("newChatBtn")
            .onclick = () => {

                saveCurrent();


                chat.innerHTML = `

                    <div class="msg bot">

                        Nouvelle conversation 🆕

                        <br><br>

                        Comment puis-je t'aider ?

                    </div>

                `;


                localStorage.removeItem(
                    "current_chat"
                );


                if(
                    window.innerWidth <= 768
                ){

                    toggleMenu();

                }

            };


        /* =========================
           POSER UNE QUESTION
        ========================= */

        async function ask(){

            const question =
                input.value.trim();


            if(!question){

                return;

            }


            /*
             * Récupérer le mode sélectionné
             */

            const mode =
                modeSelect.value;


            /*
             * Afficher la question
             */

            chat.innerHTML += `

                <div class="msg user">

                    ${escapeHtml(question)}

                </div>

            `;


            input.value = "";


                   /*
         * ID unique pour la réponse
         */

        const id = Date.now();

        chat.innerHTML += `

            <div
                class="msg bot"
                id="${id}"
            >

                Réflexion en cours...

            </div>

        `;


        chat.scrollTop =
            chat.scrollHeight;


        /*
         * Fermer le menu mobile
         */

        if(window.innerWidth <= 768){

            const panel =
                document.getElementById(
                    "historyPanel"
                );

            if(
                panel.classList.contains("open")
            ){

                toggleMenu();

            }

        }


        /*
         * Désactiver le bouton
         */

        sendBtn.disabled = true;


        try{

            /*
             * Construire l'historique
             */

            const messages = [];


            document
                .querySelectorAll("#chat .msg")
                .forEach(msg => {

                    /*
                     * Ne pas envoyer
                     * "Réflexion en cours..."
                     */

                    if(
                        msg.id === String(id)
                    ){

                        return;

                    }


                    messages.push({

                        role:
                            msg.classList
                                .contains("user")
                                ? "user"
                                : "assistant",

                        content:
                            msg.innerText

                    });

                });


            /*
             * Envoyer au serveur
             */

            const res =
                await fetch("/chat",{

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            question:
                                question,

                            messages:
                                messages,

                            mode:
                                mode

                        })

                });


            const data =
                await res.json();


            const botMessage =
                document.getElementById(id);


            if(data.reponse){

                formatBotMessage(
                    botMessage,
                    data.reponse
                );

            }
            else{

                botMessage.textContent =
                    data.error ||
                    "Une erreur est survenue.";

            }


            /*
             * Sauvegarder
             */

            saveCurrent();


        }
        catch(error){

            console.error(error);


            const botMessage =
                document.getElementById(id);


            botMessage.textContent =
                "Erreur de connexion au serveur.";

        }
        finally{

            sendBtn.disabled = false;


            chat.scrollTop =
                chat.scrollHeight;

        }

    }


    /* =========================
       ENTREE CLAVIER
    ========================= */

    input.addEventListener(
        "keypress",
        e => {

            if(e.key === "Enter"){

                ask();

            }

        }
    );


    /* =========================
       PROTECTION HTML
    ========================= */

    function escapeHtml(text){

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;

    }


    /* =========================
       CHARGER L'HISTORIQUE
    ========================= */

    renderHist();


    /* =========================
       RESTAURER LA CONVERSATION
    ========================= */

    const saved =
        localStorage.getItem(
            "current_chat"
        );


    if(saved){

        chat.innerHTML =
            saved;

    }


</script>

</body>

</html>
